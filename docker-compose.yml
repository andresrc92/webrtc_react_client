services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_ISAAC_SIM_SERVER: ${ISAAC_SIM_HOST}
        VITE_ISAAC_SIM_SIGNAL_PORT: ${ISAAC_SIGNAL_PORT:-49100}
        VITE_ISAAC_SIM_MEDIA_PORT: ${ISAAC_MEDIA_PORT:-47998}
        VITE_FORCE_WSS: "false"
    environment:
      # Side-panel backends (frost console + sim_events_server.py). nginx
      # reverse-proxies /api,/robots,/detections,/camera,/viewport to these
      # (see docker/web/nginx.conf.template) so the browser stays same-origin
      # — neither backend sends CORS headers, so hitting them directly
      # cross-origin gets blocked by the browser. Both default to
      # ISAAC_SIM_HOST since frost and sim_events_server.py normally run
      # alongside Isaac Sim; override BACKEND_HOST/SIM_EVENTS_HOST if they
      # run elsewhere. Runtime (not build) vars — changing these only needs
      # `docker compose up -d`, not a rebuild.
      BACKEND_UPSTREAM: ${BACKEND_HOST:-${ISAAC_SIM_HOST}}:${BACKEND_PORT:-8000}
      CAMERA_UPSTREAM: ${SIM_EVENTS_HOST:-${ISAAC_SIM_HOST}}:${SIM_EVENTS_PORT:-8227}
    ports:
      - "5556:80"
    restart: unless-stopped
